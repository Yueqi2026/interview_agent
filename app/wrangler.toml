name = "interview-agent"
main = "src/worker.ts"
compatibility_date = "2026-10-07"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
AI_BASE_URL = "https://api.quickrouter.ai/v1"
AI_MODEL = "gpt-5.6-sol"
ENVIRONMENT = "production"

[observability]
enabled = true
